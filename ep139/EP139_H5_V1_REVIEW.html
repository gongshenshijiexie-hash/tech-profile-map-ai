<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>EP139 H5 V1 REVIEW｜AI READS SHANGHAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage" aria-label="EP139 H5 V1 REVIEW">
    <div id="media-stack">
      <video id="es01" class="earth" src="assets/video/ES01.mp4" muted playsinline preload="auto"></video>
      <video id="es02" class="earth" src="assets/video/ES02.mp4" muted playsinline preload="auto"></video>
      <video id="es03" class="earth" src="assets/video/ES03.mp4" muted playsinline preload="auto"></video>
      <video id="es04" class="earth" src="assets/video/ES04.mp4" muted playsinline preload="auto"></video>
      <div class="grade"></div><div class="vignette"></div>
    </div>

    <section id="ai-layer" aria-hidden="true">
      <header id="hud-head"><span>AI VISION / SHANGHAI</span><span id="clock">00:00:00</span></header>
      <div id="scene-label"><small id="scene-number">SCENE 01</small><strong id="scene-title"></strong></div>
      <div id="scan"><i></i></div>
      <div id="reticle"><i></i><i></i><i></i><i></i></div>
      <div id="compare-road" class="target"><b>灰色区域 A</b><span id="road-state">ROAD ?</span></div>
      <div id="compare-building" class="target"><b>灰色区域 B</b><span id="building-state">BUILDING ?</span></div>
      <div id="magnifier"><span>LOCAL OBSERVATION</span><div class="micro-lines"></div></div>
      <div id="hypothesis"><small>COLOR MATCH</small><b>同色 = 同类？</b><em>REJECTED</em></div>
      <div id="evidence"></div>
      <div id="confidence"><span>判断置信度</span><div><i></i></div><b>24%</b></div>
      <svg id="vision-svg" viewBox="0 0 720 1280" preserveAspectRatio="none"></svg>
      <div id="model-legend"></div>
      <div id="locator"><i></i><b>POSITION NOT LOCKED</b><span>误差范围正在收敛</span></div>
      <div id="next-hook"><small>NEXT / EP140</small><strong>它此刻，到底在哪里？</strong></div>
    </section>

    <section id="subtitle-wrap" aria-live="polite"><div id="subtitle"></div></section>
    <div id="start-overlay" role="button" tabindex="0" aria-label="开始预览">
      <div class="start-mark"><i></i><span>EP139 H5 V1 REVIEW</span><strong>轻触画面开始审片</strong><small>声音将作为唯一时间轴</small></div>
    </div>
    <audio id="voice" src="assets/audio/EP139_VOICE_MASTER.wav" preload="auto"></audio>
  </main>
  <script src="app.js"></script>
</body>
</html>
